# application.yml — 어디서든 똑같은 것
spring:
  application:
    name: kiwi_backend
  jpa:
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true

app:
  crypto:
    key: ${APP_CRYPTO_KEY}
  jwt:
    secret: ${JWT_SECRET}
    access-ttl: 7d
    signup-ttl: 30m
  live:
        round-duration-seconds: 180
  kakaopay:
    base-url: https://open-api.kakaopay.com
    secret-key: ${KAKAOPAY_SECRET_KEY:}
    cid: ${KAKAOPAY_CID:TC0ONETIME}   # TC0ONETIME = 테스트 결제 (실제 돈이 빠지지 않음)
  payment:
    refund-window: 7d
