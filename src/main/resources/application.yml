# application.yml — 어디서든 똑같은 것
spring:
  application:
    name: kiwi_backend
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:25}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false

app:
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  mail:
    from: ${SMTP_FROM:}
  crypto:
    key: ${APP_CRYPTO_KEY}
  jwt:
    secret: ${JWT_SECRET}
    access-ttl: 7d
    signup-ttl: 30m
  live:
        round-duration-seconds: 180
  rtc:
    turn-urls: ${RTC_TURN_URLS:}
    turn-shared-secret: ${RTC_TURN_SHARED_SECRET:}
    credential-ttl-seconds: ${RTC_TURN_CREDENTIAL_TTL_SECONDS:3600}
    stun-urls: ${RTC_STUN_URLS:stun:stun.l.google.com:19302}
  liner:
    api-key: ${LINER_API_KEY:}
    model: ${LINER_MODEL:liner-mark-1.3}
  portone:
    api-secret: ${PORTONE_API_SECRET:}
    store-id: ${PORTONE_STORE_ID:}
    identity-channel-key: ${PORTONE_IDENTITY_CHANNEL_KEY:}

  toss:
    base-url: https://api.tosspayments.com
    # test_sk_ / test_ck_ 로 시작하는 테스트 키는 실제 돈이 빠지지 않는다. 두 키는 같은 쌍이어야 한다
    secret-key: ${TOSS_SECRET_KEY:}
    client-key: ${TOSS_CLIENT_KEY:}
    # 토스 결제창에서 돌아올 프론트 페이지. {orderId}는 주문 번호로 바뀐다
    # 배포 환경에서는 FRONTEND_URL만 프론트 주소로 바꾸면 된다 (예: https://kiwi.site)
    success-url: ${FRONTEND_URL:http://localhost:3000}/shop/payment/{orderId}/success
    fail-url: ${FRONTEND_URL:http://localhost:3000}/shop/payment/{orderId}/fail
  payment:
    refund-window: 7d
