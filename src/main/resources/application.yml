# application.yml — 어디서든 똑같은 것
spring:
  application:
    name: kiwi_backend
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  flyway:
    enabled: true
  mail:
    host: ${SMTP_HOST:localhost}
    port: ${SMTP_PORT:25}
    username: ${SMTP_USERNAME:}
    password: ${SMTP_PASSWORD:}
    properties:
      mail:
        smtp:
          auth: ${SMTP_AUTH:false}
          starttls:
            enable: ${SMTP_STARTTLS_ENABLE:true}
          connectiontimeout: 5000
          timeout: 5000
          writetimeout: 5000

management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
  health:
    mail:
      enabled: false

app:
  # 가입 축하 보석: until(한국 시간, 그 시각 포함)까지 가입한 회원에게 gem개를 준다.
  # SIGNUP_BONUS_UNTIL을 빈 값으로 두거나 gem을 0으로 하면 지급하지 않는다
  signup-bonus:
    gem: ${SIGNUP_BONUS_GEM:15}
    until: ${SIGNUP_BONUS_UNTIL:2026-11-10T23:59:59+09:00}
  session:
    call-test:
      enabled: ${APP_SESSION_CALL_TEST_ENABLED:false}
  cors:
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:3000}
  mail:
    from: ${SMTP_FROM:}
  crypto:
    key: ${APP_CRYPTO_KEY}
  jwt:
    secret: ${JWT_SECRET}
    access-ttl: 7d
    signup-ttl: 30m
  rtc:
    turn-urls: ${RTC_TURN_URLS:}
    turn-shared-secret: ${RTC_TURN_SHARED_SECRET:}
    credential-ttl-seconds: ${RTC_TURN_CREDENTIAL_TTL_SECONDS:3600}
    stun-urls: ${RTC_STUN_URLS:stun:stun.l.google.com:19302}
  liner:
    api-key: ${LINER_API_KEY:}
    model: ${LINER_MODEL:liner-mark-1.3}
  portone:
    api-secret: ${PORTONE_API_SECRET:}
    store-id: ${PORTONE_STORE_ID:}
    identity-channel-key: ${PORTONE_IDENTITY_CHANNEL_KEY:}

  nicepay:
    # 샌드박스(테스트 결제) 기본값. 운영 키를 쓸 때는 NICEPAY_BASE_URL=https://api.nicepay.co.kr
    base-url: ${NICEPAY_BASE_URL:https://sandbox-api.nicepay.co.kr}
    client-id: ${NICEPAY_CLIENT_ID:}
    secret-key: ${NICEPAY_SECRET_KEY:}
    # 결제창 인증 후 나이스페이가 form POST 하는 백엔드 주소. 배포 환경에서는 https://{API_DOMAIN}/payments/nicepay/return
    return-url: ${NICEPAY_RETURN_URL:http://localhost:8080/payments/nicepay/return}
    # 승인 처리 후 사용자를 보낼 프론트 페이지. {orderId}는 주문 번호로 바뀌고 뒤에 /success 또는 /fail이 붙는다
    # 배포 환경에서는 FRONTEND_URL만 프론트 주소로 바꾸면 된다 (예: https://kiwi.site)
    result-url: ${FRONTEND_URL:http://localhost:3000}/shop/payment/{orderId}
  payment:
    refund-window: 7d
