spring:
  datasource:
    url: jdbc:h2:mem:kiwi-${random.uuid};MODE=PostgreSQL;DB_CLOSE_DELAY=-1
    driver-class-name: org.h2.Driver
    username: sa
    password:
  jpa:
    properties:
      hibernate:
        hbm2ddl:
          halt_on_error: true
    hibernate:
      ddl-auto: create-drop
  flyway:
    enabled: false
  mail:
    host: localhost
app:
  # 테스트에서는 가입 보너스를 끈다 (지갑 잔액을 확인하는 기존 테스트가 영향받지 않게)
  signup-bonus:
    until: ""
  session:
    call-test:
      enabled: true
  scheduling:
    enabled: false
  crypto:
    key: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA=
  jwt:
    secret: AAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAAA==
  cors:
    allowed-origins: http://localhost:3000
