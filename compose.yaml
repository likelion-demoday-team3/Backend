services:
  postgres:
    image: postgres:16
    container_name: kiwi-postgres
    environment:
      POSTGRES_DB: kiwi
      POSTGRES_USER: kiwi
      POSTGRES_PASSWORD: kiwi
      TZ: UTC
    ports:
      - "5433:5432"
    volumes:
      - kiwi-pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kiwi -d kiwi"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  kiwi-pgdata:
